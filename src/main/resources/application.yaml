spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
  data:
    redis:
      host: localhost
      port: 6379
  freemarker:
    charset: UTF-8
    enabled: true
    suffix: .ftl
  liquibase:
    enabled: true
    change-log: classpath:/db/master.xml
  mail:
    host: smtp.gmail.com
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          connectionTimeout: 5000
          timeout: 5000
          writeTimeout: 5000
          ssl:
            enable: true

server:
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always

mail:
  base-url: http://localhost:8080
  sender: SkillRoute
  from: ${spring.mail.username}
  subject: Please verify your account
  content: "Dear user, please follow the link below to verify your account: <a href=$url>VERIFY</a>"
  password-reset-subject: Reset your SkillRoute password
  password-reset-content: "Dear user, please follow the link below to set a new password: <a href=$url>RESET PASSWORD</a>"

redis:
  verification:
    prefix: "verification:token:"
    ttl-minutes: 5
    resend-limit-prefix: "limit:resend:"
    resend-interval-minutes: 1
    password-reset-prefix: "password-reset:token:"
    password-reset-ttl-minutes: 15
    password-reset-limit-prefix: "limit:password-reset:"
    password-reset-interval-minutes: 1

github:
  token: ${GITHUB_TOKEN}

