spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  freemarker:
    charset: UTF-8
    enabled: true
    suffix: .ftl
  liquibase:
    enabled: true
    change-log: classpath:/db/master.xml
  mail:
    host: smtp.gmail.com
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            enable: true

server:
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /openapi/skillroute-api.yaml
    disable-swagger-default-url: true

mail:
  base-url: ${MAIL_BASE_URL:http://localhost:8080}
  sender: SkillRoute
  from: ${spring.mail.username}
  subject: Подтвердите аккаунт SkillRoute
  content: |
    <!doctype html>
    <html lang="ru">
      <head>
        <meta charset="UTF-8">
        <title>Подтверждение аккаунта SkillRoute</title>
      </head>
      <body style="margin:0;padding:0;background:#eef7f5;font-family:Arial,Helvetica,sans-serif;color:#10242f;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef7f5;padding:32px 16px;">
          <tr>
            <td align="center">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #d7ebe6;box-shadow:0 18px 45px rgba(16,36,47,0.08);">
                <tr>
                  <td style="padding:30px 34px;background:linear-gradient(135deg,#0f9f8a,#42b8e8);color:#ffffff;">
                    <div style="font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">SkillRoute</div>
                    <h1 style="margin:14px 0 0;font-size:28px;line-height:1.2;font-weight:800;">Подтвердите аккаунт</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:34px;">
                    <p style="margin:0 0 16px;font-size:17px;line-height:1.6;">Здравствуйте!</p>
                    <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#415865;">Чтобы завершить регистрацию в SkillRoute, подтвердите вашу почту. После этого вы сможете войти в аккаунт и продолжить настройку профиля.</p>
                    <a href="$url" style="display:inline-block;padding:14px 22px;background:#0f9f8a;color:#ffffff;text-decoration:none;border-radius:12px;font-size:16px;font-weight:700;">Подтвердить аккаунт</a>
                    <p style="margin:26px 0 0;font-size:13px;line-height:1.6;color:#6d7f87;">Если кнопка не открывается, скопируйте ссылку в браузер:<br><a href="$url" style="color:#0f8fbe;word-break:break-all;">$url</a></p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:20px 34px;background:#f6fbfa;color:#6d7f87;font-size:13px;line-height:1.5;">Если вы не регистрировались в SkillRoute, просто проигнорируйте это письмо.</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </body>
    </html>
  password-reset-subject: Восстановление пароля SkillRoute
  password-reset-content: |
    <!doctype html>
    <html lang="ru">
      <head>
        <meta charset="UTF-8">
        <title>Восстановление пароля SkillRoute</title>
      </head>
      <body style="margin:0;padding:0;background:#eef7f5;font-family:Arial,Helvetica,sans-serif;color:#10242f;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef7f5;padding:32px 16px;">
          <tr>
            <td align="center">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #d7ebe6;box-shadow:0 18px 45px rgba(16,36,47,0.08);">
                <tr>
                  <td style="padding:30px 34px;background:linear-gradient(135deg,#1976d2,#10a99a);color:#ffffff;">
                    <div style="font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">SkillRoute</div>
                    <h1 style="margin:14px 0 0;font-size:28px;line-height:1.2;font-weight:800;">Восстановление пароля</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:34px;">
                    <p style="margin:0 0 16px;font-size:17px;line-height:1.6;">Здравствуйте!</p>
                    <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#415865;">Мы получили запрос на смену пароля. Перейдите по ссылке ниже и задайте новый пароль для вашего аккаунта.</p>
                    <a href="$url" style="display:inline-block;padding:14px 22px;background:#1976d2;color:#ffffff;text-decoration:none;border-radius:12px;font-size:16px;font-weight:700;">Сменить пароль</a>
                    <p style="margin:26px 0 0;font-size:13px;line-height:1.6;color:#6d7f87;">Если кнопка не открывается, скопируйте ссылку в браузер:<br><a href="$url" style="color:#0f8fbe;word-break:break-all;">$url</a></p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:20px 34px;background:#f6fbfa;color:#6d7f87;font-size:13px;line-height:1.5;">Если вы не запрашивали восстановление пароля, просто проигнорируйте это письмо.</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </body>
    </html>

redis:
  verification:
    prefix: "verification:token:"
    ttl-minutes: 5
    retention-ttl-minutes: 1440
    resend-limit-prefix: "limit:resend:"
    resend-interval-minutes: 1
    password-reset-prefix: "password-reset:token:"
    password-reset-ttl-minutes: 15
    password-reset-limit-prefix: "limit:password-reset:"
    password-reset-interval-minutes: 1
    registration-limit-prefix: "limit:registration:"
    registration-interval-seconds: 30

github:
  token: ${GITHUB_TOKEN}
  sync:
    code-search-delay-millis: 7000
    worker-delay-millis: 5000
    default-rate-limit-wait-minutes: 5
    running-timeout-minutes: 30

vacancy:
  catalog:
    high-demand-limit: 5

