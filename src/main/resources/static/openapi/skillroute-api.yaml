openapi: 3.0.3
info:
  title: SkillRoute REST API
  version: "1.0"
  description: "REST API для AJAX-запросов SkillRoute: регистрация, пароль, чат, поиск навыков и синхронизация с GitHub."
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки

tags:
  - name: Регистрация
    description: AJAX-проверка полей регистрации
  - name: Восстановление пароля
    description: AJAX-проверка формы восстановления пароля
  - name: Аккаунт
    description: Проверка и изменение пароля текущего аккаунта
  - name: Навыки студента
    description: Поиск навыков студента по названию
  - name: GitHub
    description: Асинхронная синхронизация навыков студента с GitHub
  - name: Чат
    description: AJAX-запросы для диалога пользователей

paths:
  /register/check-field:
    post:
      tags:
        - Регистрация
      summary: Проверить поля регистрации
      description: Проверяет базовую DTO-валидацию и бизнес-правила регистрации. Используется для AJAX-валидации формы.
      operationId: checkRegistrationField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            examples:
              student:
                summary: Регистрация студента
                value:
                  email: developer@skillroute.com
                  password: StrongPass123
                  confirmPassword: StrongPass123
                  role: STUDENT
              company:
                summary: Регистрация компании
                value:
                  email: hr@company.com
                  password: StrongPass123
                  confirmPassword: StrongPass123
                  role: COMPANY
      responses:
        '200':
          $ref: '#/components/responses/ValidationSuccess'
        '400':
          $ref: '#/components/responses/RegistrationValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'

  /password/reset/check-field:
    post:
      tags:
        - Восстановление пароля
      summary: Проверить поля нового пароля
      description: Проверяет токен, новый пароль и подтверждение пароля. Используется на странице сброса пароля.
      operationId: checkResetPasswordField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              valid:
                summary: Корректный запрос
                value:
                  token: 5e0f1a0b-8847-4a18-a64e-d7c7565e3c21
                  newPassword: StrongPass123
                  confirmNewPassword: StrongPass123
      responses:
        '200':
          $ref: '#/components/responses/ValidationSuccess'
        '400':
          $ref: '#/components/responses/PasswordResetValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /account/password/check-field:
    post:
      tags:
        - Аккаунт
      summary: Проверить поля смены пароля
      description: Проверяет старый пароль, новый пароль и подтверждение нового пароля для авторизованного пользователя.
      operationId: checkEditPasswordField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPasswordRequest'
            examples:
              valid:
                summary: Корректный запрос
                value:
                  oldPassword: OldPass123
                  newPassword: NewPass123
                  confirmNewPassword: NewPass123
      responses:
        '200':
          $ref: '#/components/responses/ValidationSuccess'
        '400':
          $ref: '#/components/responses/EditPasswordValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /student/skills/search:
    get:
      tags:
        - Навыки студента
      summary: Найти навыки студента по названию
      description: Возвращает навыки текущего студента, название которых подходит под поисковую строку.
      operationId: searchStudentSkills
      parameters:
        - name: name
          in: query
          required: false
          description: Часть названия навыка
          schema:
            type: string
          example: Java
      responses:
        '200':
          description: Найденные навыки студента
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentSkillResponse'
              examples:
                skills:
                  summary: Список навыков
                  value:
                    - skillId: 1
                      name: Java
                      level: 80
                      confirmedByGitHub: true
                    - skillId: 2
                      name: Spring Boot
                      level: 60
                      confirmedByGitHub: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /student/skills/github-sync:
    post:
      tags:
        - GitHub
      summary: Запустить синхронизацию с GitHub
      description: Ставит асинхронную проверку навыков по GitHub в очередь. Пока задача ожидает или выполняется, кнопка на фронте остаётся в состоянии загрузки.
      operationId: startGitHubSync
      responses:
        '200':
          description: Синхронизация запущена или уже выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubSyncResponse'
              examples:
                queued:
                  summary: Задача поставлена в очередь
                  value:
                    message: Синхронизация поставлена в очередь. Можно продолжать работу на сайте
                    confirmedCount: 3
                    status: RUNNING
                    running: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'

  /student/skills/github-sync/status:
    get:
      tags:
        - GitHub
      summary: Получить статус синхронизации с GitHub
      description: Возвращает текущий статус фоновой синхронизации навыков с GitHub.
      operationId: getGitHubSyncStatus
      responses:
        '200':
          description: Текущий статус синхронизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubSyncResponse'
              examples:
                running:
                  summary: Синхронизация выполняется
                  value:
                    message: Синхронизация GitHub выполняется
                    confirmedCount: 2
                    status: RUNNING
                    running: true
                waiting:
                  summary: Ожидание лимита GitHub
                  value:
                    message: GitHub временно ограничил запросы. Синхронизация продолжится автоматически после 15:40
                    confirmedCount: 2
                    status: RUNNING
                    running: true
                success:
                  summary: Синхронизация завершена
                  value:
                    message: Навыки успешно подтверждены через GitHub
                    confirmedCount: 5
                    status: SUCCESS
                    running: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /chat/{id}/messages:
    get:
      tags:
        - Чат
      summary: Получить сообщения чата
      description: Возвращает данные диалога и список сообщений.
      operationId: getChatMessages
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор чата
          schema:
            type: integer
            format: int64
          example: 10
      responses:
        '200':
          description: Диалог найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                chat:
                  summary: Диалог по отклику
                  value:
                    chatId: 10
                    opponentName: Арина
                    companyView: true
                    studentId: 7
                    vacancyId: 4
                    vacancyName: Java-разработчик
                    studentVacancyStatus: INTERVIEW
                    closed: false
                    messages:
                      - id: 1
                        senderId: 3
                        senderName: SkillRoute Company
                        text: Здравствуйте, приглашаем вас на интервью.
                        createdAt: 18.05.2026 14:20
                        mine: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /chat/{id}/send:
    post:
      tags:
        - Чат
      summary: Отправить сообщение в чат
      description: Добавляет новое сообщение в диалог и возвращает созданное сообщение.
      operationId: sendChatMessage
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор чата
          schema:
            type: integer
            format: int64
          example: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            examples:
              message:
                summary: Новое сообщение
                value:
                  text: Спасибо, мне удобно завтра после 15:00.
      responses:
        '200':
          description: Сообщение отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                sent:
                  summary: Созданное сообщение
                  value:
                    id: 15
                    senderId: 7
                    senderName: Арина
                    text: Спасибо, мне удобно завтра после 15:00.
                    createdAt: 18.05.2026 15:10
                    mine: true
        '400':
          $ref: '#/components/responses/MessageValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:

    RegistrationRequest:
      type: object
      required:
        - email
        - password
        - confirmPassword
        - role
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          example: student@skillroute.com
        password:
          type: string
          minLength: 8
          description: Пароль пользователя
          example: StrongPass123
        confirmPassword:
          type: string
          minLength: 8
          description: Подтверждение пароля
          example: StrongPass123
        role:
          type: string
          description: Роль пользователя. Регистрация доступна только для студента или компании.
          example: STUDENT

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - confirmNewPassword
      properties:
        token:
          type: string
          description: Токен восстановления пароля
          example: 5e0f1a0b-8847-4a18-a64e-d7c7565e3c21
        newPassword:
          type: string
          minLength: 8
          description: Новый пароль
          example: NewStrongPass123
        confirmNewPassword:
          type: string
          minLength: 8
          description: Подтверждение нового пароля
          example: NewStrongPass123

    EditPasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
        - confirmNewPassword
      properties:
        oldPassword:
          type: string
          minLength: 1
          description: Текущий пароль
          example: OldPass123
        newPassword:
          type: string
          minLength: 8
          description: Новый пароль
          example: NewPass123
        confirmNewPassword:
          type: string
          minLength: 8
          description: Подтверждение нового пароля
          example: NewPass123

    MessageRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Текст сообщения
          example: Здравствуйте, мне интересно ваше предложение.
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "Текст сообщения не может быть пустым")'

    ValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Признак успешной проверки
          example: true
        message:
          type: string
          description: Сообщение для пользователя
          example: Поле заполнено корректно

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Общее сообщение об ошибке
          example: Проверьте корректность заполнения формы
        errorCode:
          type: string
          description: Код ошибки для фронтенда
          example: VALIDATION_ERROR
        fields:
          type: object
          description: Ошибки по конкретным полям формы
          additionalProperties:
            type: string
          example:
            email: Email обязателен
            password: Пароль должен содержать минимум 8 символов

    StudentSkillResponse:
      type: object
      properties:
        skillId:
          type: integer
          format: int64
          description: Идентификатор навыка
          example: 1
        name:
          type: string
          description: Название навыка
          example: Spring Boot
        level:
          type: integer
          format: int32
          description: Уровень владения навыком в процентах
          example: 70
        confirmedByGitHub:
          type: boolean
          description: Подтверждён ли навык через GitHub
          example: true

    GitHubSyncResponse:
      type: object
      properties:
        message:
          type: string
          description: Сообщение о результате или текущем состоянии синхронизации
          example: Синхронизация GitHub выполняется
        confirmedCount:
          type: integer
          format: int32
          description: Количество подтверждённых навыков
          example: 4
        status:
          type: string
          description: Текущее состояние синхронизации GitHub
          example: RUNNING
        running:
          type: boolean
          description: Выполняется ли синхронизация сейчас
          example: true

    ChatResponse:
      type: object
      properties:
        chatId:
          type: integer
          format: int64
          description: Идентификатор чата
          example: 10
        opponentName:
          type: string
          description: Имя собеседника
          example: Арина
        messages:
          type: array
          description: Сообщения диалога
          items:
            $ref: '#/components/schemas/MessageResponse'
        companyView:
          type: boolean
          description: Открыт ли чат со стороны компании
          example: true
        studentId:
          type: integer
          format: int64
          description: Идентификатор студента в отклике
          example: 7
        vacancyId:
          type: integer
          format: int64
          description: Идентификатор вакансии
          example: 4
        vacancyName:
          type: string
          description: Название вакансии
          example: Java-разработчик
        studentVacancyStatus:
          type: string
          description: Текущий статус отклика студента
          example: INTERVIEW
        closed:
          type: boolean
          description: Закрыт ли диалог для отправки сообщений
          example: false

    MessageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор сообщения
          example: 15
        senderId:
          type: integer
          format: int64
          description: Идентификатор отправителя
          example: 7
        senderName:
          type: string
          description: Имя отправителя
          example: Арина
        text:
          type: string
          description: Текст сообщения
          example: Спасибо, мне удобно завтра после 15:00.
        createdAt:
          type: string
          description: Дата и время отправки в пользовательском формате
          example: 18.05.2026 15:10
        mine:
          type: boolean
          description: Отправлено ли сообщение текущим пользователем
          example: true

  responses:
    ValidationSuccess:
      description: Поле прошло проверку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationResponse'
          examples:
            success:
              summary: Успешная проверка
              value:
                valid: true
                message: Поле заполнено корректно

    RegistrationValidationError:
      description: Ошибка регистрации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            dtoValidation:
              summary: Ошибка DTO-валидации
              value:
                message: Проверьте корректность заполнения формы
                errorCode: VALIDATION_ERROR
                fields:
                  email: Email обязателен
            businessValidation:
              summary: Ошибка бизнес-валидации
              value:
                message: Проверьте корректность заполнения формы
                errorCode: VALIDATION_ERROR
                fields:
                  email: Пользователь с таким email уже существует
                  confirmPassword: Пароли не совпадают

    PasswordResetValidationError:
      description: Ошибка восстановления пароля
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            expiredToken:
              summary: Недействительная ссылка восстановления
              value:
                message: Ссылка восстановления недействительна или срок ее действия истек
                errorCode: TOKEN_ERROR
                fields: {}
            passwordMismatch:
              summary: Пароли не совпадают
              value:
                message: Проверьте корректность заполнения формы
                errorCode: VALIDATION_ERROR
                fields:
                  confirmNewPassword: Пароли не совпадают

    EditPasswordValidationError:
      description: Ошибка смены пароля
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            wrongOldPassword:
              summary: Неверный текущий пароль
              value:
                message: Проверьте корректность заполнения формы
                errorCode: VALIDATION_ERROR
                fields:
                  oldPassword: Старый пароль указан неверно
            passwordMismatch:
              summary: Пароли не совпадают
              value:
                message: Проверьте корректность заполнения формы
                errorCode: VALIDATION_ERROR
                fields:
                  confirmNewPassword: Пароли не совпадают

    MessageValidationError:
      description: Ошибка отправки сообщения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            blank:
              summary: Пустое сообщение
              value:
                message: Проверьте корректность заполнения формы
                errorCode: VALIDATION_ERROR
                fields:
                  text: Текст сообщения не может быть пустым

    UnauthorizedError:
      description: Пользователь не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: Требуется вход
              value:
                message: Необходимо войти в аккаунт
                errorCode: UNAUTHORIZED
                fields: {}

    NotFoundError:
      description: Сущность не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              summary: Чат не найден
              value:
                message: Чат не найден
                errorCode: NOT_FOUND
                fields: {}

    TooManyRequestsError:
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tooManyRequests:
              summary: Повторный запрос слишком рано
              value:
                message: Повторно отправить письмо можно через 1 минуту
                errorCode: TOO_MANY_REQUESTS
                fields: {}

    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              summary: Непредвиденная ошибка
              value:
                message: Что-то пошло не так. Попробуйте позже
                errorCode: INTERNAL_ERROR
                fields: {}
